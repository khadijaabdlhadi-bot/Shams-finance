<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
</head>
<body>
<title>الجدول الدوري لشمس الوطن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: school header → toolbar → 18-column table whose empty top gap (periods 1–3, groups 3–12) holds the live Bohr-model panel, like a smartboard lesson. */
:root{
  --bg:#f3f7fc; --surface:#ffffff; --ink:#18263a; --muted:#5b6b82; --line:#d6e0ee;
  --blue:#1f6fb5; --sun:#f0a52a; --sun-deep:#d9631e; --ok:#1e9e5a; --bad:#d64545;
  --orbit:#9db4d3; --electron:#1f4fa8; --nucleus:#e4572e;
  --cell-ink:#1b2433;
  --c-ak:#f7a8a1; --c-ae:#fbc986; --c-tm:#f8e391; --c-pt:#a6dbc0; --c-md:#c9e59b;
  --c-nm:#9fd2f4; --c-hl:#aec5f8; --c-ng:#cfb7f3; --c-ln:#f5b7d8; --c-ac:#e7a9c6;
  --f-display:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --cell:clamp(46px, calc((100vw - 128px) / 18), 78px);
  --cellh:calc(var(--cell) * 1.12);
  --gap:clamp(2px, .35vw, 5px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1522; --surface:#172234; --ink:#e8eef8; --muted:#9aabc4; --line:#2a3a52;
  --blue:#6aaef0; --sun:#f5b84a; --sun-deep:#f08a4b; --ok:#4cd28a; --bad:#ff7a7a;
  --orbit:#3f5677; --electron:#7fb6ff; --nucleus:#ff7a4d; --cell-ink:#f3f6fb;
  --c-ak:#7a3b38; --c-ae:#7a5524; --c-tm:#6d5f1f; --c-pt:#25604a; --c-md:#4a6224;
  --c-nm:#1f5577; --c-hl:#34477e; --c-ng:#523b7c; --c-ln:#77365d; --c-ac:#663149;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1522; --surface:#172234; --ink:#e8eef8; --muted:#9aabc4; --line:#2a3a52;
  --blue:#6aaef0; --sun:#f5b84a; --sun-deep:#f08a4b; --ok:#4cd28a; --bad:#ff7a7a;
  --orbit:#3f5677; --electron:#7fb6ff; --nucleus:#ff7a4d; --cell-ink:#f3f6fb;
  --c-ak:#7a3b38; --c-ae:#7a5524; --c-tm:#6d5f1f; --c-pt:#25604a; --c-md:#4a6224;
  --c-nm:#1f5577; --c-hl:#34477e; --c-ng:#523b7c; --c-ln:#77365d; --c-ac:#663149;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0}
.wrap{padding-inline:16px;padding-block:14px 28px;max-width:1520px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:64px;height:64px;border-radius:16px;background:#fff;padding:4px;flex:none;box-shadow:0 1px 0 var(--line)}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.brand{min-width:0;flex:1}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,3vw,34px);line-height:1.15;margin:0;text-wrap:balance}
.brand h1 span{color:var(--blue)}
.brand p{margin:0;color:var(--muted);font-size:14px}
.sunline{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--blue) 0 34%,var(--sun) 34% 67%,var(--sun-deep) 67%)}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 220px;min-width:0;position:relative}
.search input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-size:15px}
.search input:focus{border-color:var(--blue);outline:none}
.seg{display:inline-flex;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--blue)}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px 3px 10px;font-size:13px;cursor:pointer;color:var(--ink)}
.chip i{width:14px;height:14px;border-radius:4px;display:inline-block;flex:none}
.chip[aria-pressed="true"]{border-color:var(--ink);font-weight:600}

/* table */
.scroller{direction:ltr;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.table{direction:ltr;display:grid;grid-template-columns:repeat(18,var(--cell));grid-template-rows:repeat(7,var(--cellh)) calc(var(--cellh)*.35) repeat(2,var(--cellh));gap:var(--gap);width:max-content;margin-inline:auto;position:relative}
.el{position:relative;border:0;border-radius:8px;background:var(--cat);color:var(--cell-ink);cursor:pointer;padding:3px 4px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;transition:transform .12s ease,opacity .2s ease,box-shadow .12s ease;min-width:0;overflow:hidden}
.el .z{align-self:flex-start;font-size:calc(var(--cell)*.17);line-height:1;font-variant-numeric:tabular-nums;opacity:.85}
.el .s{font-family:var(--f-display);font-weight:700;font-size:calc(var(--cell)*.36);line-height:1;direction:ltr}
.el .n{font-size:calc(var(--cell)*.15);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;direction:rtl}
.el:hover{transform:scale(1.12);z-index:3;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.el.sel{box-shadow:0 0 0 3px var(--ink);z-index:2}
.el.dim{opacity:.18}
.el.good{animation:pop .5s ease;box-shadow:0 0 0 4px var(--ok)}
.el.wrong{animation:shake .4s ease;box-shadow:0 0 0 4px var(--bad)}
.el.hint{box-shadow:0 0 0 4px var(--ok);animation:pulse 1s ease infinite}
.ph{border-radius:8px;border:1.5px dashed var(--line);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:calc(var(--cell)*.15);text-align:center;line-height:1.2;font-variant-numeric:tabular-nums}
.glabel{font-size:11px;color:var(--muted)}
@keyframes pop{50%{transform:scale(1.25)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pulse{50%{transform:scale(1.1)}}

/* panel inside the table gap */
.panel{grid-column:3 / 13;grid-row:1 / 4;direction:rtl;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;display:flex;gap:clamp(8px,1.4vw,22px);align-items:center;padding:clamp(6px,1vw,14px) clamp(8px,1.4vw,18px);overflow:hidden;min-width:0}
.panel .atom{flex:none;height:100%;aspect-ratio:1;max-width:45%}
.panel .atom svg{width:100%;height:100%;display:block}
.info{min-width:0;flex:1;display:flex;flex-direction:column;gap:clamp(2px,.5vw,8px);overflow:hidden}
.info .head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.info .sym{font-family:var(--f-display);font-weight:800;font-size:calc(var(--cell)*.62);line-height:1;color:var(--blue);direction:ltr}
.info .ar{font-family:var(--f-display);font-weight:700;font-size:calc(var(--cell)*.34);line-height:1.1}
.info .en{color:var(--muted);font-size:calc(var(--cell)*.2);direction:ltr}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--cell)*1.55),1fr));gap:2px 12px;font-size:calc(var(--cell)*.18);line-height:1.35}
.facts b{display:block;font-weight:600;font-variant-numeric:tabular-nums}
.facts small{color:var(--muted);font-size:.85em}
.shells{display:flex;gap:4px;flex-wrap:wrap;direction:ltr;justify-content:flex-end}
.shells span{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:0 6px;font-size:calc(var(--cell)*.18);font-variant-numeric:tabular-nums}
.shells span em{font-style:normal;color:var(--muted);margin-inline-end:3px}
.panel .zoom{align-self:flex-start;flex:none}
.quiz{flex:1;display:flex;flex-direction:column;gap:6px;align-items:flex-start;justify-content:center;min-width:0}
.quiz .q{font-family:var(--f-display);font-weight:700;font-size:calc(var(--cell)*.42);line-height:1.15}
.quiz .q span{color:var(--blue)}
.quiz .score{display:flex;gap:16px;color:var(--muted);font-size:calc(var(--cell)*.2);font-variant-numeric:tabular-nums}
.quiz .score b{color:var(--ink)}
.quiz .msg{min-height:1.4em;font-weight:600;font-size:calc(var(--cell)*.2)}
.quiz .row{display:flex;gap:8px;flex-wrap:wrap}

/* atom svg */
.orb{stroke:var(--orbit);fill:none}
.e{fill:var(--electron)}
.nuc{fill:var(--nucleus)}
.spin{transform-box:view-box;transform-origin:center;animation:spin linear infinite}
.spin.rev{animation-direction:reverse}
.mystery{width:100%;height:100%;border-radius:50%;border:2px dashed var(--orbit);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800;font-size:calc(var(--cell)*1.2);color:var(--orbit)}
.nuc-lbl{fill:#fff;font-family:var(--f-body);font-weight:600}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}.el{transition:none}}

/* overlay */
.ov{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.ov .card{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;width:min(1100px,100%);max-height:100%;overflow:auto;padding:clamp(14px,3vw,32px);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(14px,3vw,36px);align-items:center;position:relative}
.ov .big svg{width:100%;height:auto;max-height:70vh;display:block}
.ov .info .sym{font-size:clamp(56px,9vw,110px)}
.ov .info .ar{font-size:clamp(28px,4vw,46px)}
.ov .info .en{font-size:18px}
.ov .facts{font-size:16px;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px}
.ov .shells span{font-size:16px;padding:2px 9px}
.ov .nav{display:flex;gap:8px;margin-top:8px}
.ov .x{position:absolute;top:12px;left:12px;width:40px;height:40px;border-radius:50%;padding:0;font-size:20px;line-height:1}
.desc{margin:0;color:var(--muted);font-size:15px;max-width:52ch}
@media (max-width:760px){.ov .card{grid-template-columns:1fr}.ov .big svg{max-height:46vh}}

.foot{color:var(--muted);font-size:13px;text-align:center}
</style>

const CATS = {
  ak:"فلزات قلوية", ae:"فلزات قلوية ترابية", tm:"فلزات انتقالية", pt:"فلزات بعد انتقالية",
  md:"أشباه فلزات", nm:"لافلزات", hl:"هالوجينات", ng:"غازات نبيلة", ln:"لانثانيدات", ac:"أكتينيدات"
};
const SHELL = ["K","L","M","N","O","P","Q"];
const GASES = new Set([1,2,7,8,9,10,17,18,36,54,86]);
const LIQUIDS = new Set([35,80]);

function place(z){
  const ends=[2,10,18,36,54,86,118];
  const p = ends.findIndex(e=>z<=e)+1;
  if(z>=57&&z<=71) return {p:6,g:null,row:9,col:z-54};
  if(z>=89&&z<=103) return {p:7,g:null,row:10,col:z-86};
  let g;
  if(p===1) g = z===1?1:18;
  else if(p<=3){ const s=ends[p-2]; const i=z-s; g = i<=2?i:i+10; }
  else if(p<=5){ g = z-ends[p-2]; }
  else { const i=z-ends[p-2]; g = i<=2?i:z-(p===6?68:100); }
  return {p,g,row:p,col:g};
}

const EL = RAW.split("\n").map(line=>{
  const [z,sym,en,ar,mass,cat,sh]=line.split("|");
  const Z=+z, shells=sh.split(",").map(Number), pos=place(Z);
  const m = parseFloat(mass.replace(/[\[\]]/g,""));
  return {z:Z,sym,en,ar,mass,cat,shells,...pos,
    n:Math.round(m)-Z,
    state: Z>=104?"مُصنَّع (غير معروف)": GASES.has(Z)?"غاز":LIQUIDS.has(Z)?"سائل":"صلب",
    key:(ar+" "+en+" "+sym+" "+Z).toLowerCase()};
});

/* ---------- Bohr model ---------- */
const NS="http://www.w3.org/2000/svg";
function bohr(el, big){
  const n=el.shells.length, rN = big?13:12, maxR = big?88:94;
  const step=(maxR-rN-4)/n;
  let s=`<svg viewBox="-100 -100 200 200" role="img" aria-label="نموذج بور لذرة ${el.ar}">`;
  el.shells.forEach((c,i)=>{
    const r=rN+4+step*(i+1);
    const er=Math.min(big?3.2:3.4, step*.3, (2*Math.PI*r/c)*.34);
    const dur=(10+i*5).toFixed(0);
    s+=`<circle class="orb" r="${r.toFixed(2)}" stroke-width="${big?.7:.9}"/>`;
    s+=`<g class="spin${i%2?" rev":""}" style="animation-duration:${dur}s">`;
    for(let k=0;k<c;k++){
      const a=2*Math.PI*k/c - Math.PI/2 + i*.45;
      s+=`<circle class="e" r="${er.toFixed(2)}" cx="${(r*Math.cos(a)).toFixed(2)}" cy="${(r*Math.sin(a)).toFixed(2)}"/>`;
    }
    s+=`</g>`;
  });
  s+=`<circle class="nuc" r="${rN}"/>`;
  if(big) s+=`<text class="nuc-lbl" direction="ltr" text-anchor="middle" font-size="5.2"><tspan x="0" y="-1">${el.z}p⁺</tspan><tspan x="0" y="5.5">${el.n}n</tspan></text>`;
  return s+`</svg>`;
}

function infoHTML(el, big){
  const shells = el.shells.map((c,i)=>`<span><em>${SHELL[i]}</em>${c}</span>`).join("");
  const pg = el.g ? `الدورة ${el.p} · المجموعة ${el.g}` : `الدورة ${el.p} · ${CATS[el.cat]}`;
  return `<div class="head"><span class="sym">${el.sym}</span><span class="ar">${el.ar}</span><span class="en">${el.en}</span></div>
  <div class="shells" title="توزيع الإلكترونات على المستويات">${shells}</div>
  <div class="facts">
    <div><small>العدد الذري</small><b>${el.z}</b></div>
    <div><small>الكتلة الذرية</small><b>${el.mass}</b></div>
    <div><small>بروتونات · نيوترونات</small><b>${el.z} · ${el.n}</b></div>
    <div><small>إلكترونات التكافؤ</small><b>${el.shells[el.shells.length-1]}</b></div>
    <div><small>التصنيف</small><b>${CATS[el.cat]}</b></div>
    <div><small>الحالة (25°س)</small><b>${el.state}</b></div>
    ${big?`<div><small>الموقع</small><b>${pg}</b></div><div><small>عدد المستويات</small><b>${el.shells.length}</b></div>`:""}
  </div>`;
}

/* ---------- build table ---------- */
const table=document.getElementById("table"), panel=document.getElementById("panel");
const cells=new Map();
EL.forEach(el=>{
  const b=document.createElement("button");
  b.className="el"; b.style.setProperty("--cat",`var(--c-${el.cat})`);
  b.style.gridRow=el.row; b.style.gridColumn=el.col;
  b.innerHTML=`<span class="z">${el.z}</span><span class="s">${el.sym}</span><span class="n">${el.ar}</span>`;
  b.setAttribute("aria-label",`${el.ar} ${el.sym} العدد الذري ${el.z}`);
  b.addEventListener("click",()=>onPick(el));
  b.addEventListener("pointerenter",e=>{ if(e.pointerType==="mouse" && mode==="explore") show(el,false); });
  b.addEventListener("dblclick",()=>{ if(mode==="explore") openOv(el); });
  table.appendChild(b); cells.set(el.z,b);
});
[[6,"57–71"],[7,"89–103"]].forEach(([r,t])=>{
  const d=document.createElement("div"); d.className="ph"; d.style.gridRow=r; d.style.gridColumn=3; d.textContent=t; table.appendChild(d);
});
table.addEventListener("pointerleave",e=>{ if(e.pointerType==="mouse" && mode==="explore") show(current,false); });

/* legend */
const legend=document.getElementById("legend"); let catFilter=null;
Object.entries(CATS).forEach(([k,v])=>{
  const c=document.createElement("button"); c.className="chip"; c.setAttribute("aria-pressed","false");
  c.innerHTML=`<i style="background:var(--c-${k})"></i>${v}`;
  c.onclick=()=>{ catFilter = catFilter===k?null:k; [...legend.children].forEach(x=>x.setAttribute("aria-pressed","false")); if(catFilter) c.setAttribute("aria-pressed","true"); applyDim(); };
  legend.appendChild(c);
});

/* search */
const q=document.getElementById("q");
function matches(el){
  const t=q.value.trim().toLowerCase();
  if(t && !(String(el.z)===t || el.sym.toLowerCase()===t || el.key.includes(t))) return false;
  if(catFilter && el.cat!==catFilter) return false;
  return true;
}
function applyDim(){ EL.forEach(el=>cells.get(el.z).classList.toggle("dim", mode==="explore" && !matches(el))); }
q.addEventListener("input",()=>{ applyDim(); const hit=EL.filter(matches); if(q.value.trim() && hit.length) select(hit[0]); });
q.addEventListener("keydown",e=>{ if(e.key==="Enter"){ const hit=EL.filter(matches); if(hit.length) openOv(hit[0]); } });

/* explore */
let current=EL[0], mode="explore";
function show(el){
  panel.innerHTML=`<div class="atom">${bohr(el,false)}</div><div class="info">${infoHTML(el,false)}</div><button class="btn zoom" id="zoom" aria-label="تكبير">تكبير ⤢</button>`;
  panel.querySelector("#zoom").onclick=()=>openOv(el);
}
function select(el){
  cells.get(current.z).classList.remove("sel");
  current=el; cells.get(el.z).classList.add("sel"); show(el);
}
function onPick(el){ mode==="quiz" ? answer(el) : select(el); }

/* overlay */
const ov=document.getElementById("ov");
function openOv(el){
  select(el);
  document.getElementById("ov-atom").innerHTML=bohr(el,true);
  document.getElementById("ov-info").innerHTML=infoHTML(el,true)+
    `<div class="nav"><button class="btn" id="ov-prev">→ السابق</button><button class="btn" id="ov-next">التالي ←</button></div>`;
  document.getElementById("ov-prev").onclick=()=>openOv(EL[(el.z-2+118)%118]);
  document.getElementById("ov-next").onclick=()=>openOv(EL[el.z%118]);
  ov.hidden=false;
}
function closeOv(){ ov.hidden=true; cells.get(current.z).focus({preventScroll:true}); }
document.getElementById("ov-x").onclick=closeOv;
ov.addEventListener("click",e=>{ if(e.target===ov) closeOv(); });
document.addEventListener("keydown",e=>{
  if(ov.hidden) return;
  if(e.key==="Escape") closeOv();
  if(e.key==="ArrowLeft") openOv(EL[current.z%118]);
  if(e.key==="ArrowRight") openOv(EL[(current.z-2+118)%118]);
});

/* quiz */
let target=null, score=0, tries=0, streak=0, asked=0, level=20, wrongOnce=false;
function setMode(m){
  mode=m;
  document.getElementById("m-explore").setAttribute("aria-pressed",m==="explore");
  document.getElementById("m-quiz").setAttribute("aria-pressed",m==="quiz");
  EL.forEach(el=>cells.get(el.z).classList.remove("good","wrong","hint","sel"));
  applyDim();
  if(m==="quiz"){ score=0; asked=0; streak=0; nextQ(); } else select(current);
}
function nextQ(){
  EL.forEach(el=>cells.get(el.z).classList.remove("good","wrong","hint"));
  const pool=EL.filter(e=>e.z<=level);
  let t; do{ t=pool[Math.floor(Math.random()*pool.length)]; }while(target && pool.length>1 && t.z===target.z);
  target=t; tries=0; asked++;
  const kind = Math.random();
  const ask = kind<.5 ? `أين عنصر <span>${t.ar}</span>؟` : kind<.8 ? `أين العنصر الذي رمزه <span>${t.sym}</span>؟` : `أين العنصر الذي عدده الذري <span>${t.z}</span>؟`;
  renderQuiz(ask,"");
}
let lastAsk="";
function renderQuiz(ask,msg,cls,atomEl){
  lastAsk=ask;
  panel.innerHTML=`<div class="atom"></div>
  <div class="quiz">
    <div class="q">${ask}</div>
    <div class="msg" style="color:var(${cls==="ok"?"--ok":cls==="bad"?"--bad":"--muted"})">${msg||"اضغط على الخانة الصحيحة في الجدول"}</div>
    <div class="score"><span>النقاط <b>${score}</b> / ${asked}</span><span>متتالية <b>${streak}</b></span></div>
    <div class="row">
      <button class="btn" id="qz-next">سؤال جديد</button>
      <div class="seg" role="group" aria-label="المستوى"><button id="lv20" aria-pressed="${level===20}">أول 20 عنصرًا</button><button id="lv36" aria-pressed="${level===36}">أول 36</button><button id="lv118" aria-pressed="${level===118}">الكل</button></div>
    </div>
  </div>`;
  panel.querySelector(".atom").innerHTML = atomEl ? bohr(atomEl,false) : `<div class="mystery">?</div>`;
  panel.querySelector("#qz-next").onclick=()=>nextQ();
  [20,36,118].forEach(l=>panel.querySelector("#lv"+l).onclick=()=>{ level=l; score=0; asked=0; streak=0; target=null; nextQ(); });
}
function answer(el){
  if(!target) return;
  const c=cells.get(el.z);
  if(el.z===target.z){
    if(tries===0){ score++; streak++; }
    c.classList.remove("hint"); c.classList.add("good");
    renderQuiz(lastAsk, `أحسنت! ${el.ar} (${el.sym}) عدده الذري ${el.z} وتوزيعه ${el.shells.join("، ")}`, "ok", el);
    target=null;
    setTimeout(()=>{ if(mode==="quiz" && !target) nextQ(); }, 2200);
  } else {
    tries++; streak=0;
    c.classList.remove("wrong"); void c.offsetWidth; c.classList.add("wrong");
    setTimeout(()=>c.classList.remove("wrong"),900);
    if(tries>=2){ cells.get(target.z).classList.add("hint"); renderQuiz(lastAsk,`هذا ${el.ar}. الإجابة الصحيحة مضيئة باللون الأخضر`,"bad"); }
    else renderQuiz(lastAsk,`هذا ${el.ar} (${el.sym}). حاول مرة أخرى`,"bad");
  }
}
document.getElementById("m-explore").onclick=()=>setMode("explore");
document.getElementById("m-quiz").onclick=()=>setMode("quiz");

document.getElementById("fs").onclick=()=>{
  const d=document;
  try{ if(d.fullscreenElement) d.exitFullscreen(); else d.documentElement.requestFullscreen().catch(()=>{}); }catch(e){}
};

select(EL[12]); /* start on aluminium, like the lesson */
})();
