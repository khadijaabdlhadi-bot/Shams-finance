<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<link rel="manifest" href="manifest.webmanifest">

<meta property="og:title" content="لوحة شمس الوطن">
<meta property="og:description" content="مسابقة صفية بالفرق من مدرسة شمس الوطن، لأي مادة وأي مستوى">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: a TV quiz studio on a fixed 1600x900 stage, scaled to any smart board.
   Silver plaques + metal sun from the school sign, blue-glass tiles, four team podiums. */
:root {
  --studio: #070f24;
  --studio-2: #0d1b3d;
  --glass: #1d4f93;
  --glass-hi: #3b7fd0;
  --sun: #f39a2b;
  --gold: #ffd36b;
  --gold-deep: #a85a0c;
  --silver: #eef1f6;
  --silver-2: #b8c1cf;
  --ink: #0a1226;
  --text: #f5f8fc;
  --muted: #9fb1d1;
  --ok: #22c55e;
  --bad: #ef4444;
  --t0: #e5383b; --t1: #f5b700; --t2: #4caf50; --t3: #2f80ed;
  --display: "Cairo", "Tajawal", "Segoe UI", Tahoma, sans-serif;
  --body: "Tajawal", "Cairo", "Segoe UI", Tahoma, Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: #03070f; color: var(--text); font-family: var(--body); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
button { font-family: inherit; cursor: pointer; color: inherit; touch-action: manipulation; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 4px solid var(--gold); outline-offset: 3px; }
.math { direction: ltr; unicode-bidi: isolate; display: inline-block; font-family: "Segoe UI", "Cairo", Tahoma, Arial, sans-serif; font-weight: 800; color: var(--gold); white-space: nowrap; }

/* ---------- stage ---------- */
#stage {
  position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; overflow: hidden; overflow: clip;
  transform-origin: center center;
  background:
    radial-gradient(ellipse 700px 420px at 50% 46%, rgba(243,154,43,.16), transparent 70%),
    radial-gradient(ellipse 1400px 600px at 50% 120%, #14306a, transparent 65%),
    linear-gradient(180deg, var(--studio), var(--studio-2) 70%, #0a1633);
  isolation: isolate;
}
.beam { position: absolute; top: -200px; width: 380px; height: 1300px; z-index: -1; pointer-events: none;
  background: linear-gradient(180deg, rgba(150,190,255,.16), transparent 75%); filter: blur(14px);
  clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%); transform-origin: 50% 0; }
.beam.l { left: 140px; animation: sweepL 9s ease-in-out infinite alternate; }
.beam.r { right: 140px; animation: sweepR 11s ease-in-out infinite alternate; }
@keyframes sweepL { from { transform: rotate(-22deg); } to { transform: rotate(8deg); } }
@keyframes sweepR { from { transform: rotate(20deg); } to { transform: rotate(-10deg); } }
.rays { position: absolute; left: 50%; top: 46%; width: 2200px; height: 2200px; margin: -1100px 0 0 -1100px; z-index: -1; pointer-events: none;
  background: repeating-conic-gradient(rgba(255,211,107,.045) 0 5deg, transparent 5deg 15deg); animation: spin 140s linear infinite;
  -webkit-mask: radial-gradient(circle, #000 10%, transparent 60%); mask: radial-gradient(circle, #000 10%, transparent 60%); }
@keyframes spin { to { transform: rotate(360deg); } }
.floor { position: absolute; left: 0; right: 0; bottom: 0; height: 170px; z-index: -1;
  background: linear-gradient(180deg, transparent, rgba(47,128,237,.12)), repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 2px, transparent 2px 80px); }

.scr { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; }
.enter { animation: fadeUp .5s cubic-bezier(.2,.9,.3,1) both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } }

/* ---------- buttons ---------- */
.btn { border: 0; border-radius: 18px; padding: 20px 44px; font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1;
  background: linear-gradient(180deg, #fff, var(--silver) 50%, var(--silver-2)); color: var(--ink);
  box-shadow: 0 6px 0 #8a95a8, 0 14px 30px rgba(0,0,0,.45); transition: transform .08s, box-shadow .08s, filter .15s; }
.btn:hover { filter: brightness(1.05); }
.btn:active { transform: translateY(5px); box-shadow: 0 1px 0 #8a95a8, 0 6px 14px rgba(0,0,0,.45); }
.btn.gold { background: linear-gradient(180deg, #ffe7a6, var(--gold) 45%, var(--sun)); box-shadow: 0 6px 0 var(--gold-deep), 0 16px 40px rgba(243,154,43,.35); }
.btn.gold:active { box-shadow: 0 1px 0 var(--gold-deep), 0 6px 14px rgba(0,0,0,.4); }
.btn.dark { background: rgba(255,255,255,.08); color: var(--text); box-shadow: inset 0 0 0 2px rgba(255,255,255,.22); }
.btn.dark:active { transform: translateY(2px); }
.btn.sm { font-size: 22px; padding: 14px 28px; border-radius: 14px; }
.btn:disabled { opacity: .35; cursor: default; filter: grayscale(.6); }
.round { border: 0; width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 2px rgba(255,255,255,.14);
  display: grid; place-items: center; font-size: 28px; }
.round:active { transform: scale(.94); }
.round svg { width: 30px; height: 30px; fill: none; stroke: var(--text); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- intro ---------- */
#intro { align-items: center; justify-content: center; gap: 26px; text-align: center; }
.plaque { background: linear-gradient(180deg, #fff, var(--silver) 60%, var(--silver-2)); border-radius: 34px; padding: 14px;
  box-shadow: 0 0 0 6px rgba(255,211,107,.35), 0 30px 80px rgba(0,0,0,.55), 0 0 140px rgba(243,154,43,.4); }
.plaque img { display: block; border-radius: 24px; }
#intro .plaque { animation: logoIn 1.1s cubic-bezier(.2,1.3,.4,1) both; }
#intro .plaque img { width: 400px; }
@keyframes logoIn { from { transform: scale(.3) rotate(-8deg); opacity: 0; } }
.title { font-family: var(--display); font-weight: 900; font-size: 104px; line-height: 1; margin: 0;
  color: var(--gold); text-shadow: 0 2px 0 #ffe7a6, 0 6px 0 #a85a0c, 0 0 40px rgba(243,154,43,.55); }
.subtitle { font-size: 32px; font-weight: 700; color: var(--silver); margin: 0; letter-spacing: .5px; }
.samplenote { margin: 0; font-size: 22px; font-weight: 700; color: var(--muted); background: rgba(255,255,255,.06); padding: 10px 24px; border-radius: 999px; }
.samplenote b { color: var(--gold); }
.save-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.save-opt { border-radius: 22px; padding: 24px; background: rgba(255,255,255,.06); display: flex; flex-direction: column; gap: 14px; font-size: 22px; font-weight: 700; line-height: 1.6; }
.save-opt h4 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 30px; color: var(--gold); }
.save-opt ol { margin: 0; padding-inline-start: 28px; color: var(--silver); }
.save-opt .btn { align-self: flex-start; margin-top: auto; }
.save-opt small { font-size: 18px; color: var(--muted); }
.row { display: flex; gap: 22px; justify-content: center; align-items: center; flex-wrap: wrap; }

/* ---------- setup ---------- */
.panel-scr { padding: 56px 90px; gap: 30px; }
.h2 { font-family: var(--display); font-weight: 900; font-size: 64px; margin: 0; color: var(--gold); text-shadow: 0 4px 0 rgba(90,40,0,.8); }
.teams-setup { display: grid; grid-template-columns: repeat(4, 1fr); gap: 26px; }
.tcard { border-radius: 26px; padding: 26px 22px; background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.03)); box-shadow: inset 0 0 0 2px rgba(255,255,255,.08);
  display: flex; flex-direction: column; gap: 16px; align-items: center; position: relative; overflow: hidden; }
.tcard::before { content: ""; position: absolute; top: 0; right: 0; left: 0; height: 10px; background: var(--c); box-shadow: 0 0 30px var(--c); }
.tdot { width: 96px; height: 96px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff8, transparent 40%), var(--c); box-shadow: 0 0 40px var(--c); display: grid; place-items: center;
  font-family: var(--display); font-weight: 900; font-size: 44px; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.35); }
.tcard input { width: 100%; font: 800 28px var(--display); text-align: center; color: var(--text); background: rgba(0,0,0,.3); border: 2px solid rgba(255,255,255,.15); border-radius: 14px; padding: 12px; user-select: text; -webkit-user-select: text; }
.settings { display: flex; gap: 40px; justify-content: center; align-items: center; flex-wrap: wrap; font-size: 26px; font-weight: 700; color: var(--muted); }
.seg { display: inline-flex; background: rgba(255,255,255,.07); border-radius: 16px; padding: 6px; gap: 6px; margin-inline-start: 14px; }
.seg button { border: 0; background: transparent; font: 800 24px var(--display); padding: 10px 22px; border-radius: 12px; color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--gold); color: var(--ink); }

/* ---------- rules ---------- */
.rules { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 20px 40px; }
.rules li { display: flex; gap: 20px; align-items: center; font-size: 29px; font-weight: 700; line-height: 1.45; padding: 18px 22px; border-radius: 20px; background: rgba(255,255,255,.05); animation: fadeUp .5s both; }
.rules .ic { flex: none; width: 70px; height: 70px; border-radius: 18px; display: grid; place-items: center; font-size: 36px; background: linear-gradient(180deg, var(--glass-hi), var(--glass)); box-shadow: inset 0 2px 0 rgba(255,255,255,.3); }
.rules b { color: var(--gold); }

/* ---------- board ---------- */
.topbar { height: 104px; display: flex; align-items: center; gap: 22px; padding: 18px 36px 0; }
.topbar .plaque { border-radius: 16px; padding: 5px; box-shadow: 0 0 0 3px rgba(255,211,107,.3), 0 8px 20px rgba(0,0,0,.4); }
.topbar .plaque img { height: 74px; border-radius: 12px; }
.topbar .t { display: flex; flex-direction: column; }
.topbar .t b { font-family: var(--display); font-weight: 900; font-size: 40px; line-height: 1.05; color: var(--gold); }
.topbar .t span { font-size: 21px; color: var(--muted); font-weight: 700; }
.topbar .sp { flex: 1; }
.progress { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 260px; }
.progress span { font-size: 21px; font-weight: 800; color: var(--silver); }
.progress .bar { width: 260px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.1); overflow: hidden; }
.progress .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--sun), var(--gold)); border-radius: 5px; transition: width .6s; }
.topbar .tools { display: flex; gap: 12px; }

.board { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: 88px repeat(5, 1fr); gap: 14px; padding: 18px 36px 16px; min-height: 0; }
.cat { display: grid; place-items: center; text-align: center; padding: 6px 12px; border-radius: 18px;
  background: linear-gradient(180deg, #fff, var(--silver) 55%, var(--silver-2)); color: var(--ink);
  font-family: var(--display); font-weight: 900; font-size: 27px; line-height: 1.15; box-shadow: inset 0 -4px 0 rgba(0,0,0,.12), 0 10px 20px rgba(0,0,0,.4); }
.tile { position: relative; border: 0; border-radius: 18px; overflow: hidden;
  background: linear-gradient(180deg, var(--glass-hi), var(--glass) 55%, #133a72);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.35), inset 0 -6px 0 rgba(0,0,0,.25), 0 10px 18px rgba(0,0,0,.4);
  font-family: var(--display); font-weight: 900; font-size: 60px; transition: transform .15s, box-shadow .2s; animation: tileIn .5s cubic-bezier(.2,1.2,.4,1) both; }
@keyframes tileIn { from { transform: rotateX(90deg); opacity: 0; } }
.tile .v { color: var(--gold); text-shadow: 0 3px 0 rgba(0,0,0,.45); }
.tile::before { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.22), transparent); animation: shine 6s ease-in-out infinite; animation-delay: var(--d, 0s); }
@keyframes shine { 0%, 80% { left: -60%; } 100% { left: 130%; } }
.tile:not(:disabled):active { transform: scale(.96); }
.board.pick .tile:not(:disabled):hover { transform: scale(1.04); box-shadow: inset 0 2px 0 rgba(255,255,255,.4), 0 0 0 4px var(--turn), 0 0 36px var(--turn); }
.tile:disabled { cursor: default; background: rgba(255,255,255,.035); box-shadow: inset 0 0 0 2px rgba(255,255,255,.06); animation: none; }
.tile:disabled::before { display: none; }
.tile:disabled .v { display: none; }
.tile .won { display: none; }
.tile:disabled .won { display: flex; position: absolute; top: 0; right: 0; bottom: 0; left: 0; align-items: center; justify-content: center; gap: 10px; font-size: 22px; font-weight: 800; color: var(--muted); }
.tile.locked { opacity: .28; background: linear-gradient(180deg, var(--glass-hi), var(--glass) 55%, #133a72); }
.tile.locked .v { display: inline; }
.tile:disabled .won i { width: 26px; height: 26px; border-radius: 50%; background: var(--wc, rgba(255,255,255,.15)); box-shadow: 0 0 16px var(--wc, transparent); }

.pods { height: 150px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; padding: 0 36px 22px; }
.pod { position: relative; border-radius: 22px; padding: 14px 20px; display: flex; align-items: center; gap: 16px;
  background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.025)); box-shadow: inset 0 0 0 2px rgba(255,255,255,.07);
  transition: transform .35s cubic-bezier(.2,1.3,.4,1), box-shadow .35s; }
.pod::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 0; height: 7px; border-radius: 4px; background: var(--c); box-shadow: 0 0 20px var(--c); }
.pod.turn { transform: translateY(-10px); box-shadow: inset 0 0 0 3px var(--c), 0 0 40px -6px var(--c); background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.04)); }
.pod .dot { flex: none; width: 58px; height: 58px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff8, transparent 40%), var(--c); display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 28px; color: #fff; }
.pod .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.pod .nm { font-family: var(--display); font-weight: 800; font-size: 26px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
.pod .ll { display: flex; gap: 8px; }
.pod .ll span { font-size: 16px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.12); }
.pod .ll span.used { opacity: .3; text-decoration: line-through; }
.pod .sc { font-family: var(--display); font-weight: 900; font-size: 54px; font-variant-numeric: tabular-nums; line-height: 1; }
.pod .crown { position: absolute; top: -26px; right: 20px; font-size: 38px; filter: drop-shadow(0 0 10px var(--gold)); animation: bob 1.4s ease-in-out infinite alternate; }
@keyframes bob { to { transform: translateY(-6px); } }
.turntag { position: absolute; top: -18px; left: 18px; background: var(--c); color: #fff; font-weight: 800; font-size: 17px; padding: 4px 14px; border-radius: 999px; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
.pop { animation: pop .7s; }
@keyframes pop { 30% { transform: scale(1.35); color: var(--gold); } }

/* ---------- banner ---------- */
#banner { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 30; display: flex; align-items: center; justify-content: center; pointer-events: none; }
#banner .strip { width: 100%; padding: 34px 0; text-align: center; background: linear-gradient(90deg, transparent, var(--c) 18%, var(--c) 82%, transparent);
  box-shadow: 0 0 80px var(--c); animation: stripIn 1.9s cubic-bezier(.2,.9,.3,1) both; }
#banner .strip b { display: block; margin-bottom: 14px; font-family: var(--display); font-weight: 900; font-size: 92px; line-height: 1.1; color: #fff; text-shadow: 0 5px 0 rgba(0,0,0,.35); }
#banner .strip span { display: block; font-size: 36px; font-weight: 800; color: #fff; opacity: .95; }
@keyframes stripIn { 0% { transform: scaleY(0); opacity: 0; } 14% { transform: scaleY(1); opacity: 1; } 82% { transform: none; opacity: 1; } 100% { transform: translateX(-120%); opacity: 0; } }

/* ---------- question ---------- */
#qv { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 20; justify-content: center; background: rgba(3,8,20,.86); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: flex; flex-direction: column; padding: 30px 60px 34px; gap: 22px; }
.qtop { display: flex; align-items: center; gap: 20px; height: 110px; }
.qtop .chip { font-family: var(--display); font-weight: 900; font-size: 32px; padding: 10px 26px; border-radius: 16px; background: linear-gradient(180deg, #fff, var(--silver) 60%, var(--silver-2)); color: var(--ink); }
.qtop .val { font-family: var(--display); font-weight: 900; font-size: 40px; padding: 4px 28px; border-radius: 16px; background: linear-gradient(180deg, #ffe7a6, var(--gold), var(--sun)); color: var(--ink); }
.qtop .gold { font-size: 28px; font-weight: 900; color: var(--gold); text-shadow: 0 0 20px var(--sun); }
.qtop .sp { flex: 1; }
.who { display: flex; align-items: center; gap: 14px; font-family: var(--display); font-weight: 900; font-size: 34px; padding: 10px 26px; border-radius: 999px; background: var(--c); color: #fff; box-shadow: 0 0 40px var(--c); text-shadow: 0 2px 0 rgba(0,0,0,.3); }
.clock { position: relative; width: 120px; height: 120px; flex: none; }
.clock svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.clock circle { fill: none; stroke-width: 12; }
.clock .bg { stroke: rgba(255,255,255,.1); }
.clock .fg { stroke: var(--cc, var(--ok)); stroke-linecap: round; transition: stroke-dashoffset 1s linear, stroke .3s; }
.clock b { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 50px; font-variant-numeric: tabular-nums; }
.clock.urgent { animation: throb .5s infinite alternate; }
@keyframes throb { to { transform: scale(1.1); } }
.qbox { flex: none; min-height: 210px; display: grid; place-items: center; text-align: center; padding: 26px 50px; border-radius: 30px;
  background: linear-gradient(180deg, rgba(59,127,208,.35), rgba(29,79,147,.25)); box-shadow: inset 0 0 0 3px rgba(120,170,240,.4), 0 20px 60px rgba(0,0,0,.4);
  font-family: var(--display); font-weight: 800; font-size: 54px; line-height: 1.5; animation: qIn .6s cubic-bezier(.2,1.2,.4,1) both; }
.qbox.golden { background: linear-gradient(180deg, rgba(255,211,107,.3), rgba(243,154,43,.15)); box-shadow: inset 0 0 0 3px var(--gold), 0 0 60px rgba(255,211,107,.35); }
@keyframes qIn { from { transform: scale(.6); opacity: 0; } }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
.ch { position: relative; display: flex; align-items: center; gap: 22px; min-height: 104px; padding: 14px 26px; border: 0; border-radius: 22px; text-align: start;
  background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.04)); box-shadow: inset 0 0 0 3px rgba(255,255,255,.14);
  font-family: var(--display); font-weight: 800; font-size: 40px; animation: fadeUp .45s both; transition: background .25s, box-shadow .25s, opacity .3s, transform .15s; }
.ch .lt { flex: none; width: 70px; height: 70px; border-radius: 18px; display: grid; place-items: center; font-size: 36px; font-weight: 900; color: var(--ink);
  background: linear-gradient(180deg, #fff, var(--silver) 60%, var(--silver-2)); }
.ch .tx { min-width: 0; }
.ch:not(:disabled):active { transform: scale(.98); }
.ch.sel { background: linear-gradient(180deg, rgba(255,255,255,.2), rgba(0,0,0,.2)), var(--c); box-shadow: inset 0 0 0 4px #fff, 0 0 40px var(--c); }
.ch.sel .lt { background: #fff; }
.ch.locked { animation: lockPulse .45s infinite alternate; }
@keyframes lockPulse { to { box-shadow: inset 0 0 0 4px var(--gold), 0 0 60px var(--gold); } }
.ch.right { background: linear-gradient(180deg, #2fd56c, #149443); box-shadow: inset 0 0 0 4px #b7ffd0, 0 0 50px rgba(34,197,94,.7); animation: none; }
.ch.wrong { background: linear-gradient(180deg, #f05252, #b21f1f); box-shadow: inset 0 0 0 4px #ffc9c9, 0 0 40px rgba(239,68,68,.6); animation: shake .45s; }
.ch.gone { opacity: .12; }
.ch:disabled { cursor: default; }
@keyframes shake { 20% { transform: translateX(-14px); } 40% { transform: translateX(14px); } 60% { transform: translateX(-9px); } 80% { transform: translateX(9px); } }
.openans { text-align: center; font-family: var(--display); font-weight: 800; font-size: 44px; padding: 22px; border-radius: 22px; background: rgba(34,197,94,.18); box-shadow: inset 0 0 0 3px var(--ok); animation: qIn .5s both; }
.openans small { display: block; font-size: 24px; color: var(--muted); }
.qbar { margin-top: 20px; display: flex; align-items: center; gap: 18px; min-height: 92px; }
.qbar .sp { flex: 1; }
.qbar .msg { font-family: var(--display); font-weight: 900; font-size: 40px; }
.ll-btn { display: flex; align-items: center; gap: 12px; border: 0; border-radius: 18px; padding: 16px 24px; font: 800 26px var(--display); background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 2px rgba(255,255,255,.2); }
.ll-btn em { font-style: normal; font-size: 30px; }
.ll-btn:disabled { opacity: .3; cursor: default; }
.steal { display: flex; align-items: center; gap: 16px; }
.steal .tb { border: 0; border-radius: 18px; padding: 18px 26px; font: 900 28px var(--display); color: #fff; background: var(--c); box-shadow: 0 6px 0 rgba(0,0,0,.35), 0 0 26px -6px var(--c); text-shadow: 0 2px 0 rgba(0,0,0,.3); }
.steal .tb:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }

.fly { position: absolute; z-index: 40; font-family: var(--display); font-weight: 900; font-size: 64px; color: var(--gold); text-shadow: 0 4px 0 rgba(90,40,0,.9), 0 0 30px var(--sun); pointer-events: none; transition: transform 1s cubic-bezier(.5,-0.3,.6,1), opacity 1s; }

/* golden splash / generic center */
.center { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 35; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; text-align: center; background: rgba(3,8,20,.82); }
.sunball { width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fffbe6, var(--gold) 38%, var(--sun) 70%, #c2650c); box-shadow: 0 0 120px var(--gold), 0 0 260px var(--sun); animation: sunIn 1s cubic-bezier(.2,1.5,.4,1) both, throb .7s .9s infinite alternate; display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 92px; color: var(--ink); }
@keyframes sunIn { from { transform: scale(0) rotate(-180deg); } }
.center h2 { font-family: var(--display); font-weight: 900; font-size: 92px; margin: 0; color: var(--gold); text-shadow: 0 6px 0 rgba(90,40,0,.9), 0 0 50px var(--sun); animation: fadeUp .6s .3s both; }
.center p { font-size: 40px; font-weight: 800; margin: 0; animation: fadeUp .6s .5s both; }

/* winner */
#win { z-index: 36; background: rgba(3,8,20,.94); gap: 18px; }
#win h2 { font-size: 76px; }
.podium { display: flex; align-items: flex-end; gap: 30px; }
.pcol { width: 250px; display: flex; flex-direction: column; align-items: center; gap: 10px; opacity: 0; transform: translateY(40px); transition: opacity .5s, transform .6s cubic-bezier(.2,1.3,.4,1); }
.pcol.show { opacity: 1; transform: none; }
.pcol .nm { font-family: var(--display); font-weight: 900; font-size: 32px; }
.pcol .pts { font-family: var(--display); font-weight: 900; font-size: 40px; line-height: 1; color: var(--gold); }
.pcol .blk { width: 100%; border-radius: 22px 22px 6px 6px; display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 64px; color: #fff; text-shadow: 0 5px 0 rgba(0,0,0,.35);
  background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(0,0,0,.45)), var(--c); box-shadow: 0 0 46px -8px var(--c); }
.pcol .cr { font-size: 64px; height: 72px; }

/* menu */
#menu { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 45; background: rgba(3,8,20,.88); display: flex; align-items: center; justify-content: center; }
.menu-box { width: 980px; border-radius: 30px; padding: 40px 50px; background: linear-gradient(180deg, var(--studio-2), var(--studio)); box-shadow: 0 0 0 3px var(--glass-hi), 0 30px 80px rgba(0,0,0,.6); display: flex; flex-direction: column; gap: 28px; animation: qIn .4s both; }
.menu-box h3 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 48px; color: var(--gold); }
.adj { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.adj div { border-radius: 18px; padding: 16px; background: rgba(255,255,255,.06); border-top: 7px solid var(--c); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.adj b { font-family: var(--display); font-size: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.adj strong { font-family: var(--display); font-weight: 900; font-size: 44px; }
.adj .r { display: flex; gap: 10px; }
.adj button { border: 0; width: 64px; height: 50px; border-radius: 12px; font: 900 22px var(--display); background: rgba(255,255,255,.12); }
.menu-actions { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }

.toast { position: absolute; bottom: 190px; left: 50%; transform: translateX(-50%); z-index: 60; background: linear-gradient(180deg, #ffe7a6, var(--gold)); color: var(--ink); font: 900 30px var(--display); padding: 14px 34px; border-radius: 999px; box-shadow: 0 14px 40px rgba(0,0,0,.5); animation: fadeUp .3s both; white-space: nowrap; }

#fx { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 80; pointer-events: none; width: 100%; height: 100%; }

/* ---------- editor (normal page, not scaled) ---------- */
#editor { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 90; overflow-y: auto; background: #0b1530; padding: 24px 16px 0; user-select: text; -webkit-user-select: text; }
.ed { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; font-size: 16px; }
.ed h2 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 34px; color: var(--gold); }
.ed .note { margin: 0; color: var(--muted); line-height: 1.8; }
.ed code { background: rgba(255,255,255,.1); padding: 1px 6px; border-radius: 4px; }
.ed-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.fld { display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: 14px; font-weight: 700; min-width: 0; }
.fld input, .fld textarea, .ed textarea { font: 600 17px var(--body); color: var(--text); background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.18); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; }
.fld textarea { min-height: 70px; resize: vertical; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tabs button { border: 0; border-radius: 999px; padding: 10px 18px; font: 800 16px var(--display); background: rgba(255,255,255,.08); }
.tabs button[aria-selected="true"] { background: var(--gold); color: var(--ink); }
.edq { border-radius: 16px; padding: 16px; background: rgba(255,255,255,.04); border-inline-start: 6px solid var(--gold); display: flex; flex-direction: column; gap: 10px; }
.edq h3 { margin: 0; font-family: var(--display); font-weight: 900; color: var(--gold); font-size: 22px; }
.edch { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.edch label.opt { display: flex; align-items: center; gap: 8px; }
.edch input[type=radio] { width: 22px; height: 22px; accent-color: #22c55e; flex: none; }
.edbar { position: sticky; bottom: 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 16px 0; background: #0b1530; border-top: 1px solid rgba(255,255,255,.1); }
.ebtn { border: 0; border-radius: 12px; padding: 12px 22px; font: 800 18px var(--display); background: rgba(255,255,255,.1); }
.ebtn.gold { background: var(--gold); color: var(--ink); }
.ed details summary { cursor: pointer; color: var(--gold); font-weight: 800; }
.etoast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); z-index: 95; background: var(--gold); color: var(--ink); font: 800 18px var(--display); padding: 10px 22px; border-radius: 999px; }
@media (max-width: 700px) { .edch { grid-template-columns: minmax(0, 1fr); } }

var fx = $("#fx"), cx = fx.getContext("2d"), parts = [], fxOn = false;

window.addEventListener("resize", sizeFx); sizeFx();
function confetti(n, colors, from) {
  if (REDUCE) return;
  colors = colors || ["#e5383b", "#f5b700", "#4caf50", "#2f80ed", "#ffd36b", "#ffffff", "#9b2c5e"];
  var r = window.devicePixelRatio || 1, W = fx.width, H = fx.height;
  for (var i = 0; i < (n || 150); i++) {
    var side = from === "sides" ? (i % 2 ? 0 : W) : W / 2 + (Math.random() - .5) * W * .3;
    parts.push({ x: side, y: from === "sides" ? H * .7 : H * .4, vx: from === "sides" ? (side ? -1 : 1) * (8 + Math.random() * 18) * r : (Math.random() - .5) * 28 * r,
      vy: (-Math.random() * 24 - 10) * r, s: (6 + Math.random() * 8) * r, c: colors[i % colors.length], a: Math.random() * 6, va: (Math.random() - .5) * .4, w: Math.random() * 10, life: 0 });
  }

}

  cx.clearRect(0, 0, fx.width, fx.height);
  var r = window.devicePixelRatio || 1;
  parts = parts.filter(function (p) { return p.y < fx.height + 50 && p.life < 420; });
  parts.forEach(function (p) {
    p.vy += .5 * r; p.vx *= .985; p.x += p.vx + Math.sin(p.w + p.life / 9) * r; p.y += p.vy; p.a += p.va; p.life++;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.scale(1, Math.cos(p.life / 6)); cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); cx.restore();

}

// Fair play: 5 rounds, one per value. In each round every team picks exactly one

function roundInfo() {
  for (var r = 0; r < 5; r++) { var n = 0; for (var c = 0; c < 5; c++) if (G.used[c + "-" + r] != null) n++; if (n < 5) return { r: r, n: n }; }
  return null;
}
function syncTurn() { var ri = roundInfo(); G.turn = !ri ? -1 : (ri.n < 4 ? (ri.r + ri.n) % 4 : -1); return ri; }
function renderBoard(animate) {

  $("#progBar").style.width = (done / 25 * 100) + "%";
  var h = data.categories.map(function (c) { return '<div class="cat">' + esc(c.name) + '</div>'; }).join("");
  for (var r = 0; r < 5; r++) for (var c = 0; c < 5; c++) {

    var won = u != null ? (u >= 0 ? '<span class="won" style="--wc:' + TEAM_HEX[u] + '"><i></i>' + esc(G.teams[u].name) + '</span>' : '<span class="won"><i></i>بدون نقاط</span>') : "";
    h += '<button class="tile' + (lock ? " locked" : "") + '" data-k="' + k + '"' + (dis ? " disabled" : "") + ' style="--d:' + ((c + r) * .3) + 's;' + (animate ? "animation-delay:" + ((r * 5 + c) * .03) + "s" : "animation:none") + '" aria-label="' + esc(data.categories[c].name) + " " + VALUES[r] + '"><span class="v">' + VALUES[r] + '</span>' + won + '</button>';

}
function leaderIdx() {

function announceTurn() {

$("#bMenu").onclick = function () { SFX.tap(); openMenu(); };

/* ---------------- question ---------------- */
var timerT = null, left = 0, total = 30;
function stopTimer() { clearInterval(timerT); timerT = null; }
function runTimer(sec, onEnd) {
  stopTimer(); total = sec; left = sec; drawClock();
  timerT = setInterval(function () {
    left--; drawClock();
    if (left <= 0) { stopTimer(); onEnd(); } else if (left <= 5) SFX.tick(true);
  }, 1000);
}
function addTime(s) { left += s; total = Math.max(total, left); drawClock(); }
function drawClock() {
  var el = $("#clock"); if (!el) return;
  var C = 2 * Math.PI * 52, p = Math.max(0, left / total);
  el.querySelector(".fg").style.strokeDashoffset = (C * (1 - p)).toFixed(1);
  el.style.setProperty("--cc", left <= 5 ? "var(--bad)" : p <= .5 ? "var(--sun)" : "var(--ok)");
  el.classList.toggle("urgent", left > 0 && left <= 5);
  el.querySelector("b").textContent = Math.max(0, left);
}

function openQuestion(k) {
  var cr = k.split("-").map(Number), item = data.categories[cr[0]].qs[cr[1]];
  var choices = (item.choices || []).map(function (s) { return String(s || "").trim(); });
  var hasChoices = choices.filter(Boolean).length >= 2 && item.correct >= 0 && choices[item.correct];
  Q = { k: k, c: cr[0], r: cr[1], item: item, choices: choices, mc: !!hasChoices, gold: G.turn < 0 && cr[1] === 4, team: G.turn, sel: -1, gone: [], phase: "answer", stealing: false };
  $("#grid").classList.remove("pick");
  SFX.select();
  var tile = $('.tile[data-k="' + k + '"]'); if (tile) tile.style.transform = "scale(1.08)";
  later(function () {
    if (Q.gold) {
      var s = $("#splash");
      s.innerHTML = '<div class="sunball">×2</div><h2>سؤال الشمس الذهبي!</h2><p>النقاط مضاعفة: <span style="color:var(--gold)">' + (VALUES[Q.r] * 2) + '</span> نقطة</p>';
      s.hidden = false; SFX.golden(); confetti(110, ["#ffd36b", "#f39a2b", "#fff6d6", "#ffffff"]);
      later(function () { s.hidden = true; renderQuestion(); }, 2800);
    } else renderQuestion();
  }, 450);
}
function pts() { return VALUES[Q.r] * (Q.gold ? 2 : 1); }
function renderQuestion() {

  var whoHtml = Q.team < 0 ? '<span class="who" id="who" style="--c:#e08a1e">✋ سؤال للجميع</span>' : '<span class="who" id="who" style="--c:' + TEAM_HEX[Q.team] + '">يجاوب: ' + esc(t.name) + '</span>';
  qv.innerHTML =
    '<div class="qtop">' +
      '<span class="chip">' + esc(data.categories[Q.c].name) + '</span>' +

      '<span class="sp"></span>' +
      whoHtml +
      '<div class="clock" id="clock"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" cx="60" cy="60" r="52" stroke-dasharray="' + C + '" stroke-dashoffset="0"/></svg><b></b></div>' +
    '</div>' +
    '<div class="qbox' + (Q.gold ? " golden" : "") + '"><div>' + rich(Q.item.q) + '</div></div>' +
    (Q.mc ? '<div class="choices" id="choices">' + Q.choices.map(function (ch, i) {
      return ch ? '<button class="ch" data-i="' + i + '" style="animation-delay:' + (.5 + i * .15) + 's;--c:' + TEAM_HEX[Q.team] + '"><span class="lt">' + LET[i] + '</span><span class="tx" dir="auto">' + rich(ch) + '</span></button>' : "";
    }).join("") + '</div>' : '<div id="openSlot"></div>') +

}
function setBar(html) { $("#qbar").innerHTML = html; }
function startAnswer() {
  Q.sel = -1;

    Q.phase = "buzz"; startThink(); runTimer(G.settings.timer || 30, onTimeUp);
    setBar('<span class="msg" style="color:var(--gold)">✋ أول فريق يرفع يده:</span><span class="sp"></span><div class="steal">' +
      G.teams.map(function (t, i) { return '<button class="tb" data-buzz="' + i + '" style="--c:' + TEAM_HEX[i] + '">' + esc(t.name) + '</button>'; }).join("") + '</div>');
    return;

function paintAnswerBar() {

      (!Q.stealing ? '<button class="ll-btn" id="llFifty"' + (t.fifty ? "" : " disabled") + '><em>½</em> حذف إجابتين</button>' +
                     '<button class="ll-btn" id="llTime"' + (t.extra ? "" : " disabled") + '><em>⏱</em> +15 ثانية</button>' : '<span class="msg" style="color:' + TEAM_HEX[Q.team] + '">فرصة سرقة: نص النقاط (' + (pts() / 2) + ')</span>') +
      '<span class="sp"></span>' +
      '<span class="msg" id="hintMsg" style="font-size:28px;color:var(--muted)">المسوا الإجابة اللي اخترتوها</span>' +

  } else {

      '<button class="btn sm" id="judgeNo" style="background:linear-gradient(180deg,#f87171,#b91c1c);color:#fff;box-shadow:0 6px 0 #7f1d1d">✗ غلط</button>' +
      '<button class="btn sm" id="judgeYes" style="background:linear-gradient(180deg,#4ade80,#15803d);color:#fff;box-shadow:0 6px 0 #14532d">✓ صح</button>');

$("#qv").addEventListener("click", function (e) {
  if (!Q) return;
  var b = e.target.closest("button"); if (!b || b.disabled) return;
  if (b.classList.contains("ch") && Q.phase === "answer") {
    var i = +b.dataset.i; if (Q.gone.indexOf(i) >= 0) return;
    Q.sel = i; SFX.tap();
    $$(".ch").forEach(function (x) { x.classList.toggle("sel", +x.dataset.i === i); x.style.setProperty("--c", TEAM_HEX[Q.team]); });
    $("#confirm").disabled = false; var hm = $("#hintMsg"); if (hm) hm.textContent = "متأكدين؟";
    return;
  }
  switch (b.id) {
    case "confirm": lockAnswer(); break;
    case "llFifty": useFifty(); break;
    case "llTime": G.teams[Q.team].extra = false; b.disabled = true; addTime(15); SFX.bonus(); toast("+15 ثانية!"); save(); break;
    case "judgeYes": stopTimer(); stopThink(); showOpenAnswer(); win(); break;
    case "judgeNo": stopTimer(); stopThink(); SFX.wrong(); afterWrong(); break;
    case "showOpen": showOpenAnswer(); break;
    case "noSteal": revealAndFinish(false); break;

function useFifty() {

  wrong.sort(function () { return Math.random() - .5; });
  Q.gone = wrong.slice(0, Math.max(0, wrong.length - 1)).slice(0, 2);
  Q.gone.forEach(function (i) { var el = $('.ch[data-i="' + i + '"]'); el.classList.add("gone"); el.classList.remove("sel"); el.disabled = true; });
  if (Q.gone.indexOf(Q.sel) >= 0) { Q.sel = -1; $("#confirm").disabled = true; }

}
function lockAnswer() {

      G.teams.map(function (t, i) { return i === Q.team ? "" : '<button class="tb" data-steal="' + i + '" style="--c:' + TEAM_HEX[i] + '">' + esc(t.name) + '</button>'; }).join("") +
      '<button class="btn dark sm" id="noSteal">ولا فريق</button></div>');

}
function beginBuzz(i) {

}

  if (Q.mc) {
    $$(".ch").forEach(function (x) { var n = +x.dataset.i; x.classList.remove("sel"); x.disabled = Q.gone.indexOf(n) >= 0; if (Q.gone.indexOf(n) >= 0) { x.classList.remove("wrong"); x.classList.add("gone"); } });
  }

function showOpenAnswer() {
  var slot = $("#openSlot"); if (!slot || slot.childElementCount) return;

function win() {

  setBar('<span class="msg" style="color:var(--muted)">هذي هي الإجابة الصحيحة</span><span class="sp"></span><button class="btn gold" id="next">متابعة</button>');

function flyPoints(txt, ti) {

/* ---------------- winner ---------------- */

  }).join("") + '</div><div class="row" id="wBtns" style="opacity:0"><button class="btn dark sm" id="wBoard">رجوع للوحة</button><button class="btn gold" id="wNew">مسابقة جديدة</button></div>';
  w.hidden = false;
  SFX.fanfare();
  [3, 2, 1].forEach(function (rk, n) { later(function () { var el = $('.pcol[data-rank="' + rk + '"]'); if (el) el.classList.add("show"); SFX.lock(); }, 500 + n * 650); });
  later(function () {
    $('.pcol[data-rank="0"]').classList.add("show");
    var t = $("#wTitle"); t.textContent = winners.length > 1 ? "تعادل! مبروك للفائزين" : "مبروك " + winners[0].name + "!"; t.style.opacity = 1;
    $("#wBtns").style.opacity = 1;
    confetti(240); later(function () { confetti(180, null, "sides"); }, 1200); later(function () { confetti(180); }, 2600);
  }, 2600);
  $("#wBoard").onclick = function () { w.hidden = true; };
  $("#wNew").onclick = function () { w.hidden = true; sdel(KG); G = null; renderIntro(); };
}

/* ---------------- menu ---------------- */
function openMenu() {
  var m = $("#menu");
  m.innerHTML = '<div class="menu-box"><h3>القائمة</h3>' +
    '<div class="adj">' + G.teams.map(function (t, i) {
      return '<div style="--c:' + TEAM_C[i] + '"><b>' + esc(t.name) + '</b><strong id="ms' + i + '">' + t.score + '</strong><div class="r"><button data-a="' + i + '" data-d="-100">−100</button><button data-a="' + i + '" data-d="100">+100</button></div></div>';
    }).join("") + '</div>' +
    '<div class="menu-actions">' +
      '<button class="btn gold sm" id="mClose">رجوع للمسابقة</button>' +
      '<button class="btn sm" id="mWin">🏆 إعلان النتيجة الآن</button>' +
      '<button class="btn dark sm" id="mEdit">تعديل الأسئلة</button>' +
      '<button class="btn dark sm" id="mHome">الشاشة الرئيسية</button>' +
    '</div></div>';
  m.hidden = false;
}
$("#menu").addEventListener("click", function (e) {
  var b = e.target.closest("button"); if (!b) return;
  if (b.dataset.a != null && G) { var i = +b.dataset.a; G.teams[i].score += +b.dataset.d; save(); $("#ms" + i).textContent = G.teams[i].score; SFX.tap(); renderPods(); return; }
  var m = $("#menu");
  if (b.id === "mClose") { m.hidden = true; }
  if (b.id === "doDownload") { downloadApp(); return; }
  if (b.id === "doInstall") {
    if (installEvt) { installEvt.prompt(); installEvt = null; }
    else toast("من قائمة المتصفح ⋮ اختاري «تثبيت التطبيق»");
    return;
  }
  if (b.id === "mWin") { m.hidden = true; showWinner(); }
  if (b.id === "mEdit") { m.hidden = true; openEditor(); }
  if (b.id === "mHome") { m.hidden = true; renderIntro(); }
});

/* ---------------- editor ---------------- */
var edCat = 0, draft = null, resetArmed = false;
function openEditor() { draft = clone(data); edCat = 0; resetArmed = false; paintEditor(); $("#editor").hidden = false; }
function paintEditor() {
  var cat = draft.categories[edCat];
  $("#editor").innerHTML = '<div class="ed" dir="rtl">' +
    '<h2>تعديل الأسئلة</h2>' +
    '<p class="note">لكل سؤال اكتبي النص والخيارات الأربعة، واختاري الدائرة اللي جنب <b>الإجابة الصحيحة</b>. لو تبي سؤال بدون خيارات، خلي الخيارات فاضية واكتبي الإجابة في خانة «الإجابة»، والمعلمة تحكم بزر صح أو غلط. حطي المعادلات بين علامتي <code>`</code> مثل: <code>حل `2x + 4 = 10`</code></p>' +
    (JSON.stringify(draft.categories) === JSON.stringify(SAMPLE.categories) ? '<p class="note" style="color:var(--gold)">الأسئلة الموجودة أمثلة من الرياضيات توضّح الطريقة. بدّليها بأسئلة أي مادة أو مستوى، وبدّلي أسماء المحاور زادة.</p>' : '') +
    '<div class="ed-grid"><label class="fld">عنوان المسابقة<input id="eTitle" value="' + esc(draft.title) + '"></label><label class="fld">العنوان الفرعي<input id="eSub" value="' + esc(draft.subtitle) + '"></label></div>' +
    '<div class="tabs" role="tablist">' + draft.categories.map(function (c, i) { return '<button role="tab" data-tab="' + i + '" aria-selected="' + (i === edCat) + '">' + esc(c.name || "محور " + (i + 1)) + '</button>'; }).join("") + '</div>' +
    '<label class="fld">اسم المحور<input id="eCat" value="' + esc(cat.name) + '"></label>' +
    cat.qs.map(function (q, r) {
      var ch = q.choices || [];
      return '<div class="edq"><h3>سؤال ' + VALUES[r] + ' نقطة</h3>' +
        '<label class="fld">نص السؤال<textarea id="eQ' + r + '">' + esc(q.q) + '</textarea></label>' +
        '<div class="edch">' + [0, 1, 2, 3].map(function (j) {
          return '<label class="fld">الخيار ' + LET[j] + '<span class="opt" style="display:flex;gap:8px;align-items:center"><input type="radio" name="eR' + r + '" id="eR' + r + '_' + j + '"' + (q.correct === j ? " checked" : "") + ' aria-label="الإجابة الصحيحة ' + LET[j] + '"><input id="eC' + r + '_' + j + '" value="' + esc(ch[j] || "") + '"></span></label>';
        }).join("") + '</div>' +
        '<label class="fld">الإجابة (للأسئلة بدون خيارات)<input id="eA' + r + '" value="' + esc(q.answer || "") + '"></label></div>';
    }).join("") +
    '<div class="ed-grid" style="align-items:center"><button class="ebtn" id="eFileSave">📁 حفظ الأسئلة في ملف</button><label class="ebtn" style="text-align:center;cursor:pointer">📂 فتح ملف أسئلة<input type="file" id="eFile" accept=".json,application/json,text/plain" hidden></label></div>' +
    '<p class="note">احفظي كل مجموعة أسئلة في ملف (مثلاً: علوم الصف الثالث)، وافتحيها وقت ما تحتاجيها.</p>' +
    '<details><summary>نقل الأسئلة بالنسخ واللصق</summary><p class="note">اضغطي «نسخ الأسئلة» وابعتي النص لنفسك، وفي الجهاز الثاني الصقيه هنا واضغطي «استيراد».</p><textarea id="eJson" rows="5" dir="ltr" style="width:100%"></textarea><div style="display:flex;gap:10px;margin-top:10px"><button class="ebtn" id="eCopy">نسخ الأسئلة</button><button class="ebtn" id="eImport">استيراد</button></div></details>' +
    '<div class="edbar"><button class="ebtn gold" id="eSave">حفظ الأسئلة</button><button class="ebtn" id="eClose">إغلاق بدون حفظ</button><span style="flex:1"></span><button class="ebtn" id="eReset">' + (resetArmed ? "متأكدة؟ اضغطي مرة ثانية" : "استرجاع الأسئلة التجريبية") + '</button></div>' +
  '</div>';
}
function collect() {
  if (!$("#eTitle")) return;
  draft.title = $("#eTitle").value.trim() || SAMPLE.title; draft.subtitle = $("#eSub").value.trim();
  var cat = draft.categories[edCat]; cat.name = $("#eCat").value.trim();
  cat.qs.forEach(function (q, r) {
    q.q = $("#eQ" + r).value.trim();
    q.choices = [0, 1, 2, 3].map(function (j) { return $("#eC" + r + "_" + j).value.trim(); });
    q.correct = -1; [0, 1, 2, 3].forEach(function (j) { if ($("#eR" + r + "_" + j).checked) q.correct = j; });
    q.answer = $("#eA" + r).value.trim();
  });
}
function etoast(m) { var t = document.createElement("div"); t.className = "etoast"; t.textContent = m; document.body.appendChild(t); later(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 2500); }
$("#editor").addEventListener("click", function (e) {
  var b = e.target.closest("button"); if (!b) return;
  if (b.dataset.tab != null) { collect(); edCat = +b.dataset.tab; paintEditor(); return; }
  if (b.id === "eSave") {
    collect();
    var bad = [];
    draft.categories.forEach(function (c) { c.qs.forEach(function (q, r) { var n = q.choices.filter(Boolean).length; if (n >= 2 && (q.correct < 0 || !q.choices[q.correct])) bad.push(c.name + " " + VALUES[r]); }); });
    if (bad.length) { etoast("حددي الإجابة الصحيحة في: " + bad.slice(0, 3).join("، ")); return; }
    data = draft; sset(KD, data); $("#editor").hidden = true; toast("تم حفظ الأسئلة");
    if (G && !$("#board").hidden) renderBoard(false); else renderIntro();
    return;
  }
  if (b.id === "eClose") { $("#editor").hidden = true; return; }
  if (b.id === "eReset") {
    if (!resetArmed) { collect(); resetArmed = true; paintEditor(); return; }
    draft = clone(SAMPLE); resetArmed = false; edCat = 0; paintEditor(); etoast("رجعت الأسئلة التجريبية، اضغطي «حفظ الأسئلة»"); return;
  }
  if (b.id === "eCopy") {
    collect(); var ta = $("#eJson"); ta.value = JSON.stringify(draft); ta.closest("details").open = true;
    var ok = function () { etoast("تم النسخ"); }, no = function () { ta.select(); etoast("النص محدد، انسخيه"); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(ok, no); else no();
    return;
  }
  if (b.id === "eFileSave") {
    collect();
    saveBlob(new Blob([JSON.stringify(draft, null, 1)], { type: "application/json" }), "shams-questions-" + new Date().toISOString().slice(0, 10) + ".json");
    etoast("تم حفظ ملف الأسئلة في ملفاتك"); return;
  }
  if (b.id === "eImport") {
    try {
      var d = JSON.parse($("#eJson").value);
      if (!d.categories || d.categories.length !== 5 || d.categories.some(function (c) { return !c.qs || c.qs.length !== 5; })) throw 0;
      draft = d; edCat = 0; paintEditor(); etoast("تم الاستيراد، اضغطي «حفظ الأسئلة»");
    } catch (er) { etoast("النص غير صحيح، تأكدي إنك نسختيه كامل"); }
  }
});

function validData(d) { return d && d.categories && d.categories.length === 5 && !d.categories.some(function (c) { return !c.qs || c.qs.length !== 5; }); }
$("#editor").addEventListener("change", function (e) {
  if (e.target.id !== "eFile" || !e.target.files || !e.target.files[0]) return;
  var fr = new FileReader();
  fr.onload = function () {
    try { var d = JSON.parse(fr.result); if (!validData(d)) throw 0; draft = d; edCat = 0; paintEditor(); etoast("انفتح ملف الأسئلة، اضغطي «حفظ الأسئلة»"); }
    catch (er) { etoast("هذا الملف مش ملف أسئلة صحيح"); }
  };
  fr.readAsText(e.target.files[0]);
});

/* ---------------- boot ---------------- */
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) { try { navigator.serviceWorker.register("sw.js"); } catch (e) {} }
renderIntro();
})();
</script>
</body>
</html>
